name: Publish HACS release notes

on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check source and tests
        run: npm run check
      - name: Build card
        run: npm run build
      - name: Verify built file matches source
        run: git diff --exit-code -- dist/daily-goals-card.js

      - name: Prepare release notes
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version_file="package.json"
          version="$(jq -r '.version' "$version_file")"

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "package.json has no version."
            exit 1
          fi

          source_version="$(awk -F"'" '/const VERSION =/{print $2; exit}' src/daily-goals-card.js)"
          if [ "$source_version" != "$version" ]; then
            echo "package.json and src/daily-goals-card.js must use the same version."
            exit 1
          fi

          # A normal push only publishes a release when its package version changed.
          if [ "$EVENT_NAME" = "push" ] && git cat-file -e "$BEFORE_SHA:$version_file" 2>/dev/null; then
            previous_version="$(git show "$BEFORE_SHA:$version_file" | jq -r '.version')"
            if [ "$version" = "$previous_version" ]; then
              echo "create=false" >> "$GITHUB_OUTPUT"
              echo "The version has not changed; no release will be published."
              exit 0
            fi
          fi

          notes="$(awk -v heading="## $version" '
            $0 == heading { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md)"

          if [ -z "$notes" ]; then
            echo "No matching CHANGELOG.md section found for version $version."
            exit 1
          fi

          {
            echo "create=true"
            echo "version=$version"
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.release.outputs.create == 'true'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = process.env.VERSION;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: version });
              core.info(`Release ${version} already exists; nothing to do.`);
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: version,
                target_commitish: context.sha,
                name: version,
                body: process.env.NOTES.trim(),
              });
              core.info(`Published release ${version}.`);
            }
